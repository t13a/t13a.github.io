name: Pages

on:
  push:
    branches: [master]
  schedule:
    # Monthly data refresh. Its commit also keeps GitHub from disabling the schedule
    # after 60 days without repository activity.
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      # Pushes made with GITHUB_TOKEN start no new workflow runs, so the refreshed data
      # is committed and built in this same run.
      - name: Refresh GitHub data
        if: github.event_name != 'push'
        run: npm run fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/github.json src/assets/avatar.png
          git diff --cached --quiet || { git commit -m 'Refresh GitHub data'; git push; }

      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
